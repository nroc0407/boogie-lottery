<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#040906">
  <meta name="description" content="디시인사이드 댓글 참가자의 활동을 확인하고 당첨자를 추첨합니다.">
  <title>부기 추첨자</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%23040906' d='M0 0h32v32H0z'/%3E%3Ctext x='6' y='24' font-family='monospace' font-size='25' fill='%2352e883'%3EB%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="app-shell" data-phase="idle">
    <header class="titlebar"><h1>부기 추첨자</h1><span class="program-name">CONSOLE</span></header>
    <div class="terminal-body">
      <form id="analysis-form">
        <fieldset class="settings-panel">
          <legend>추첨 설정</legend>
          <label class="field-label" for="post-url">게시글 주소</label>
          <div class="url-row">
            <input id="post-url" type="url" placeholder="https://gall.dcinside.com/…" required maxlength="2048" autocomplete="off" spellcheck="false">
            <button id="example-button" class="text-button" type="button">예시</button>
          </div>
          <div class="number-controls">
            <div class="field"><label for="winner-count">당첨 인원</label><div class="input-group"><input id="winner-count" type="number" min="1" max="100" step="1" value="1" required><span>명</span></div></div>
            <div class="field"><label for="period-value">평가기간</label><div class="input-group period-control"><input id="period-value" type="number" min="1" max="24" step="1" value="6" required aria-label="평가기간 수"><select id="period-unit" aria-label="평가기간 단위"><option value="months">개월</option><option value="days">일</option></select></div></div>
            <div class="field"><label for="min-posts">최소 글</label><div class="input-group"><input id="min-posts" type="number" min="0" max="1000" step="1" value="3" required aria-describedby="activity-help"><span>개</span></div></div>
            <div class="field"><label for="min-comments">최소 댓글</label><div class="input-group"><input id="min-comments" type="number" min="0" max="1000" step="1" value="0" required aria-describedby="activity-help"><span>개</span></div></div>
          </div>
          <div class="settings-bottom">
            <details class="extra-options">
              <summary>추가 설정</summary>
              <div class="options-body">
                <label for="keyword">참여 키워드</label>
                <input id="keyword" type="text" placeholder="전체 댓글" maxlength="80" autocomplete="off">
                <div class="checkbox-options">
                  <label><input id="include-replies" type="checkbox" checked>대댓글 포함</label>
                  <label><input id="exclude-author" type="checkbox" checked>글쓴이 제외</label>
                  <label><input id="include-guests" type="checkbox">유동 포함</label>
                </div>
              </div>
            </details>
            <small id="activity-help">글·댓글 모두 충족 / 0 = 검사 끄기</small>
          </div>
          <div class="run-actions"><button id="start-button" class="primary-button" type="submit"><span id="start-label">추첨 시작</span></button><button id="stop-button" type="button" hidden>중단</button></div>
        </fieldset>
      </form>

      <fieldset class="progress-panel">
        <legend>진행 상황 <span id="elapsed-time">00:00</span></legend>
        <div class="flow-steps" aria-label="진행 단계"><span data-step="comments">1 댓글 수집</span><span data-step="activity">2 활동 확인</span><span data-step="draw">3 추첨</span></div>
        <div id="status-banner" class="status-banner" role="status" aria-live="polite"><span id="status-indicator" aria-hidden="true">[·]</span><span id="status-text">대기 중</span><span id="status-pages"></span></div>
        <div class="console-output">
          <ol id="progress-log" aria-label="처리 내역"></ol>
          <div id="welcome" class="console-prompt" aria-hidden="true">&gt; <span class="cursor">_</span></div>
        </div>
        <div class="progress-footer"><span id="coverage-detail">글 0p / 댓글 0p</span><span id="coverage-state">대기</span></div>
        <div class="metric-grid">
          <div>댓글 <strong id="metric-comments">0</strong></div><div>참가 <strong id="metric-participants">0</strong></div><div>후보 <strong id="metric-eligible">0</strong></div><div>보류 <strong id="metric-pending">0</strong></div>
        </div>
      </fieldset>

      <section id="results" hidden>
        <div class="results-heading"><div><h2 id="report-title"></h2><p id="report-subtitle"></p><p id="coverage-label"></p></div><a id="source-post" target="_blank" rel="noopener noreferrer">원문</a></div>
        <fieldset id="winner-section" class="winner-section" hidden aria-live="polite"><legend>당첨자</legend><div id="winner-list" class="winner-list"></div><p id="draw-detail"></p></fieldset>
        <details class="participants-panel">
          <summary>참가자 <span id="participant-count"></span></summary>
          <div class="table-wrap"><table><thead><tr><th>참가자</th><th>유형</th><th>참여 댓글</th><th>글</th><th>댓글</th><th>최근 활동</th><th>판정</th></tr></thead><tbody id="participant-table"></tbody></table></div>
          <p id="participants-empty">수집 중</p>
        </details>
        <div class="report-actions"><button id="redraw-button" type="button" disabled>다시 추첨</button><button id="copy-result" type="button" disabled>결과 복사</button><button id="export-csv" type="button" disabled>CSV 저장</button></div>
      </section>
    </div>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
